<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Food Store | Carrito</title>
    <link rel="stylesheet" href="/src/styles/store.css" />
  </head>

  <body>
    <header class="site-header">
      <div class="brand">
        <img src="/assets/Logo - Food Store.png" alt="Logo Food Store" />
        <div>
          <h1>Food Store</h1>
          <p>Carrito de compras</p>
        </div>
      </div>

      <nav class="nav">
       <a href="../../../../index.html">Inicio</a>
       <a href="../home/home.html">Catálogo</a>
       <a href="./cart.html">Carrito <span id="cart-count">0</span></a>
       <a href="../../admin/home/home.html">Panel Admin</a>
      </nav>
    </header>

    <main>
      <section class="cart-section">
        <h2>Mi carrito</h2>
        <p id="cart-feedback" class="feedback"></p>

        <div id="cart-container" class="cart-container"></div>

        <section class="cart-summary">
          <h3>Resumen de compra</h3>
          <p>Cantidad total de productos: <strong id="summary-count">0</strong></p>
          <p>Total a pagar: <strong id="summary-total">$0</strong></p>

          <div class="cart-actions">
            <button type="button" id="clear-cart-button">Vaciar carrito</button>
            <button type="button" id="checkout-button" disabled>
              Finalizar compra
            </button>
          </div>
        </section>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Food Store - Todos los derechos reservados.</p>
      <p>Contacto: contacto@foodstore.com</p>
    </footer>

    <script type="module" src="./cart.ts"></script>
  </body>
</html>
