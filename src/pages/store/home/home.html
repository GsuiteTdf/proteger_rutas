<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Food Store | Catálogo</title>
<link rel="stylesheet" href="/src/styles/store.css" />
</head>

  <body>
    <header class="site-header">
      <div class="brand">
        <img src="/assets/Logo - Food Store.png" alt="Logo Food Store" />
        <div>
          <h1>Food Store</h1>
          <p>Catálogo de productos</p>
        </div>
      </div>

      <nav class="nav">
        <a href="../../../../index.html">Inicio</a>
        <a href="./home.html">Catálogo</a>
        <a href="../cart/cart.html">Carrito <span id="cart-count">0</span></a>
        <a href="../../admin/home/home.html">Panel Admin</a>
      </nav>
    </header>

    <main>
      <section class="categories-section">
        <h2>Categorías</h2>
        <div id="categories-container" class="categories"></div>
      </section>

      <section class="search-section">
        <h2>Buscar productos</h2>

        <form id="search-form">
          <label for="search-input">Buscar por nombre:</label>
          <input
            type="search"
            id="search-input"
            placeholder="Ej: pizza, hamburguesa, coca"
          />
          <button type="submit">Buscar</button>
        </form>
      </section>

      <section class="products-section">
        <h2>Productos destacados</h2>
        <p id="active-filter">Mostrando todos los productos</p>
        <p id="feedback" class="feedback"></p>

        <div id="products-container" class="products-grid"></div>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Food Store - Todos los derechos reservados.</p>
      <p>Contacto: contacto@foodstore.com</p>
    </footer>

    <script type="module" src="./home.ts"></script>
  </body>
</html>
